<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b18"><meta name="description" content="Lista para coleccionar monstruos Número de Yu-Gi-Oh!">
<link rel="manifest" href="manifest.json"><link rel="icon" href="assets/icon-192.png">
<title>Numbers Card Binder</title>
<style>
:root{color-scheme:dark;--bg:#080a16;--panel:#12162b;--line:#343b68;--purple:#9b5cff;--cyan:#4ad8ff;--green:#3be28d;--red:#ff526c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#171c43 0,#080a16 55%);color:#f5f5ff;font:15px system-ui,Arial,sans-serif}
header{position:relative;min-height:220px;overflow:hidden;border-bottom:1px solid #5742a4;background:#090b18}
.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 32%;opacity:.7}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,#080a16 0%,#080a16b8 48%,transparent 100%),linear-gradient(0deg,#080a16,transparent 60%)}
.headtxt{position:relative;padding:28px 18px 20px;max-width:750px}.eyebrow{color:#65dfff;letter-spacing:4px;font-size:11px;font-weight:800}
h1{font-size:clamp(28px,8vw,44px);line-height:1;margin:8px 0;text-shadow:0 0 18px #8a46ff}.sub{color:#c6c9e9;margin:0}
main{max-width:850px;margin:auto;padding:14px 13px 100px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:-2px}.stat{background:#11152a;border:1px solid var(--line);border-radius:13px;padding:11px;text-align:center}.stat b{display:block;font-size:25px}.stat span{font-size:11px;color:#b9bfdf}
.progress{height:7px;background:#292d48;border-radius:20px;margin:10px 0 15px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c4dff,#39dfff);transition:width .2s}
.controls{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}input,select,button{font:inherit;color:#fff;background:#12172d;border:1px solid #414a7c;border-radius:11px;padding:11px}input{min-width:0;flex:1}button{cursor:pointer;font-weight:650}button.primary{background:linear-gradient(120deg,#743cff,#3a58dc);border:0}button.danger{border-color:#a33b59;color:#ff9bad}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 10px}.tabs button{white-space:nowrap;padding:9px 13px}.tabs button.active{border-color:#a16aff;background:#30205a;box-shadow:0 0 12px #713cff70}
.list{display:grid;gap:8px}.card{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;background:linear-gradient(120deg,#141a32,#0e1224);border:1px solid #30385f;border-radius:13px;padding:11px}.card strong{display:block;font-size:14px;overflow-wrap:anywhere}.meta{color:#9ca7d5;font-size:11px;margin-top:3px}.status{display:flex;align-items:center;gap:7px}.status label{font-size:11px;color:#b8c0e5;white-space:nowrap}.status input{accent-color:#9b5cff;width:21px;height:21px;flex:none}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.actions button{flex:1}
.empty{text-align:center;color:#aeb6dc;padding:25px}
dialog{background:#11162c;color:white;border:1px solid #6570ad;border-radius:16px;width:min(92vw,430px)}dialog::backdrop{background:#000b}dialog form{display:grid;gap:10px}dialog h3{margin:0}dialog input,dialog select{width:100%}
footer{text-align:center;color:#7f89b8;font-size:11px;padding:20px 10px}
@media(min-width:650px){.list{grid-template-columns:1fr 1fr}.headtxt{padding-top:40px}.card{min-height:78px}}
</style></head>
<body>
<header><img class="hero" src="assets/numbers-hero.jpg" alt=""><div class="shade"></div><div class="headtxt"><div class="eyebrow">YU-GI-OH! · COLECCIÓN</div><h1>NUMBERS<br>CARD BINDER</h1><p class="sub">Tu colección de monstruos Número, organizada.</p></div></header>
<main>
<section class="stats"><div class="stat"><b id="total">0</b><span>TOTAL</span></div><div class="stat"><b id="owned">0</b><span>LOS TENGO</span></div><div class="stat"><b id="missing">0</b><span>ME FALTAN</span></div></section>
<div class="progress"><i id="bar"></i></div>
<div class="controls"><input id="search" placeholder="Buscar por número o nombre..." aria-label="Buscar"><select id="status"><option value="all">Todos</option><option value="owned">Los tengo</option><option value="missing">Me faltan</option></select></div>
<div class="tabs" id="tabs"></div>
<div class="list" id="list"></div>
<div class="actions"><button class="primary" id="add">＋ Agregar carta</button><button id="backup">Exportar respaldo</button><button id="restore">Importar respaldo</button></div>
<div class="actions"><button id="csv">Descargar CSV</button><button class="danger" id="reset">Desmarcar todo</button></div>
<footer>El progreso se guarda automáticamente en este dispositivo. Exporta un respaldo para conservarlo al cambiar de teléfono.</footer>
</main>
<dialog id="dlg"><form method="dialog" id="addForm"><h3>Agregar monstruo Número</h3><input id="newName" placeholder="Nombre exacto de la carta" required><select id="newCat"><option>1–100</option><option>Originales >100</option><option>Chaos</option><option>Shining</option><option>Future</option><option>Otras variantes</option><option>Personalizada</option></select><div class="actions"><button value="cancel">Cancelar</button><button class="primary" id="save" value="default">Guardar</button></div></form></dialog>
<input type="file" id="file" accept="application/json" hidden>

const KEY='numbersBinder_v1';
let cards=load(),category='Todos';
const categories=['Todos','1–100','Originales >100','Chaos','Shining','Future','Otras variantes','Personalizada'];
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)?x:initial.map(c=>({...c}))}catch{return initial.map(c=>({...c}))}}
function save(){localStorage.setItem(KEY,JSON.stringify(cards));render()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
 const owned=cards.filter(c=>c.owned).length,missing=cards.length-owned;
 total.textContent=cards.length;document.getElementById('owned').textContent=owned;document.getElementById('missing').textContent=missing;
 bar.style.width=(cards.length?owned/cards.length*100:0)+'%';
 tabs.innerHTML=categories.map(c=>`<button class="${category===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
 const q=search.value.toLowerCase(),s=status.value;
 const shown=cards.filter(c=>(category==='Todos'||c.category===category)&&(!q||(c.name+' '+c.category).toLowerCase().includes(q))&&(s==='all'||(s==='owned'?c.owned:!c.owned)));
 list.innerHTML=shown.length?shown.map(c=>`<article class="card"><div><strong>${esc(c.name)}</strong><div class="meta">${esc(c.category)}${c.custom?' · Agregada por ti':''}</div></div><div class="status"><label>${c.owned?'La tengo':'Me falta'}</label><input type="checkbox" data-own="${esc(c.id)}" ${c.owned?'checked':''} aria-label="Marcar como tengo"></div><button class="danger" data-del="${esc(c.id)}" title="Eliminar" aria-label="Eliminar">✕</button></article>`).join(''):'<div class="empty">No hay cartas en esta búsqueda.</div>';
}
tabs.addEventListener('click',e=>{let b=e.target.closest('[data-cat]');if(b){category=b.dataset.cat;render()}});
list.addEventListener('change',e=>{let id=e.target.dataset.own;if(id){let c=cards.find(x=>x.id===id);if(c){c.owned=e.target.checked;save()}}});
list.addEventListener('click',e=>{let id=e.target.dataset.del;if(id&&confirm('¿Eliminar esta carta de tu lista?')){cards=cards.filter(c=>c.id!==id);save()}});
search.addEventListener('input',render);status.addEventListener('change',render);
add.onclick=()=>dlg.showModal();
addForm.addEventListener('submit',e=>{if(e.submitter?.id==='save'){e.preventDefault();let name=newName.value.trim();if(!name)return;cards.push({id:'u'+Date.now(),name,category:newCat.value,owned:false,custom:true});newName.value='';dlg.close();save()}});
backup.onclick=()=>download('numbers-respaldo.json',JSON.stringify(cards,null,2),'application/json');
restore.onclick=()=>file.click();
file.onchange=async()=>{let f=file.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x))throw Error();if(confirm('¿Reemplazar la lista actual con el respaldo?')){cards=x;save();alert('Respaldo importado.')}}catch{alert('El archivo no es un respaldo válido.')}file.value=''};
csv.onclick=()=>download('numbers-coleccion.csv','Nombre,Categoría,Estado\\n'+cards.map(c=>'"'+c.name.replace(/"/g,'""')+'","'+c.category+'","'+(c.owned?'La tengo':'Me falta')+'"').join('\\n'),'text/csv;charset=utf-8');
reset.onclick=()=>{if(confirm('¿Desmarcar todas las cartas? No se eliminará ninguna.')){cards.forEach(c=>c.owned=false);save()}};
function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js');
render();
</script></body></html>
