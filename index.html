<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b18"><meta name="description" content="Lista para coleccionar monstruos Número de Yu-Gi-Oh!">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="assets/icon-192.png"><link rel="apple-touch-icon" href="assets/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Numbers">
<title>Numbers Card Binder</title>
<style>
:root{color-scheme:dark;--bg:#080a16;--panel:#12162b;--line:#343b68;--purple:#9b5cff;--cyan:#4ad8ff;--green:#3be28d;--red:#ff526c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#171c43 0,#080a16 55%);color:#f5f5ff;font:15px system-ui,Arial,sans-serif}
header{position:relative;min-height:220px;overflow:hidden;border-bottom:1px solid #5742a4;background:#090b18}
.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 32%;opacity:.7}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,#080a16 0%,#080a16b8 48%,transparent 100%),linear-gradient(0deg,#080a16,transparent 60%)}
.headtxt{position:relative;padding:28px 18px 20px;max-width:750px}.eyebrow{color:#65dfff;letter-spacing:4px;font-size:11px;font-weight:800}
h1{font-size:clamp(28px,8vw,44px);line-height:1;margin:8px 0;text-shadow:0 0 18px #8a46ff}.sub{color:#c6c9e9;margin:0}
main{max-width:850px;margin:auto;padding:14px 13px 100px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:-2px}.stat{background:#11152a;border:1px solid var(--line);border-radius:13px;padding:11px;text-align:center}.stat b{display:block;font-size:25px}.stat span{font-size:11px;color:#b9bfdf}
.progress{height:7px;background:#292d48;border-radius:20px;margin:10px 0 15px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c4dff,#39dfff);transition:width .2s}
.controls{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}input,select,button{font:inherit;color:#fff;background:#12172d;border:1px solid #414a7c;border-radius:11px;padding:11px}input{min-width:0;flex:1}button{cursor:pointer;font-weight:650}button.primary{background:linear-gradient(120deg,#743cff,#3a58dc);border:0}button.danger{border-color:#a33b59;color:#ff9bad}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 10px}.tabs button{white-space:nowrap;padding:9px 13px}.tabs button.active{border-color:#a16aff;background:#30205a;box-shadow:0 0 12px #713cff70}
.list{display:grid;gap:8px}.card{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;background:linear-gradient(120deg,#141a32,#0e1224);border:1px solid #30385f;border-radius:13px;padding:11px}.card strong{display:block;font-size:14px;overflow-wrap:anywhere}.meta{color:#9ca7d5;font-size:11px;margin-top:3px}.status{display:flex;align-items:center;gap:7px}.status label{font-size:11px;color:#b8c0e5;white-space:nowrap}.status input{accent-color:#9b5cff;width:21px;height:21px;flex:none}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.actions button{flex:1}
.empty{text-align:center;color:#aeb6dc;padding:25px}
dialog{background:#11162c;color:white;border:1px solid #6570ad;border-radius:16px;width:min(92vw,430px)}dialog::backdrop{background:#000b}dialog form{display:grid;gap:10px}dialog h3{margin:0}dialog input,dialog select{width:100%}
footer{text-align:center;color:#7f89b8;font-size:11px;padding:20px 10px}
@media(min-width:650px){.list{grid-template-columns:1fr 1fr}.headtxt{padding-top:40px}.card{min-height:78px}}

.add-panel{background:#12162b;border:1px solid #6570ad;border-radius:14px;padding:14px;margin:16px 0}
.add-panel label{display:block;margin-bottom:9px}
.add-row{display:grid;grid-template-columns:1fr;gap:8px}
.add-row input,.add-row select,.add-row button{width:100%;min-height:48px;font:inherit}
.add-row input,.add-row select{background:#090d20;color:#fff;border:1px solid #59618e;border-radius:9px;padding:10px}
.hint{font-size:12px;color:#b8c2e8;margin:8px 0 0}
@media(min-width:650px){.add-row{grid-template-columns:2fr 1fr auto}}

</style></head>
<body>
<header><img class="hero" src="assets/numbers-hero.jpg" alt=""><div class="shade"></div><div class="headtxt"><div class="eyebrow">YU-GI-OH! · COLECCIÓN</div><h1>NUMBERS<br>CARD BINDER</h1><p class="sub">Tu colección de monstruos Número, organizada.</p></div></header>
<main>
<section class="stats"><div class="stat"><b id="total">0</b><span>TOTAL</span></div><div class="stat"><b id="owned">0</b><span>LOS TENGO</span></div><div class="stat"><b id="missing">0</b><span>ME FALTAN</span></div></section>
<div class="progress"><i id="bar"></i></div>
<div class="controls"><input id="search" placeholder="Buscar por número o nombre..." aria-label="Buscar"><select id="status"><option value="all">Todos</option><option value="owned">Los tengo</option><option value="missing">Me faltan</option></select></div>
<div class="tabs" id="tabs"></div>
<div class="list" id="list"></div>
<section class="add-panel">
<label for="newName"><strong>Agregar una carta a tu colección</strong></label>
<div class="add-row">
<input id="newName" type="text" placeholder="Escribe aquí el nombre de la carta..." autocomplete="off">
<select id="newCat" aria-label="Categoría">
<option>Personalizada</option><option>1–100</option><option>Originales >100</option>
<option>Chaos</option><option>Shining</option><option>Future</option><option>Otras variantes</option>
</select>
<button class="primary" id="add" type="button">＋ Agregar carta</button>
</div>
<p id="addHint" class="hint">Escribe el nombre y pulsa “Agregar carta”.</p>
</section>
<div class="actions"><button id="backup">Exportar respaldo</button><button id="restore">Importar respaldo</button></div>
<div class="actions"><button id="csv">Descargar CSV</button><button class="danger" id="reset">Desmarcar todo</button></div>
<footer>El progreso se guarda automáticamente en este dispositivo. Exporta un respaldo para conservarlo al cambiar de teléfono.</footer>
</main>
<input type="file" id="file" accept="application/json" hidden>

const KEY='numbersBinder_v1';
const byId=id=>document.getElementById(id);
let cards=loadCards();
let category='Todos';
const categories=['Todos','1–100','Originales >100','Chaos','Shining','Future','Otras variantes','Personalizada'];

function loadCards(){
 try{
  const saved=localStorage.getItem(KEY);
  if(saved===null)return initial.map(c=>({...c}));
  const parsed=JSON.parse(saved);
  return Array.isArray(parsed)?parsed:initial.map(c=>({...c}));
 }catch(error){return initial.map(c=>({...c}));}
}
function escapeHtml(value){
 return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}
function saveCards(){
 try{localStorage.setItem(KEY,JSON.stringify(cards));}
 catch(error){alert('No se pudo guardar en este navegador.');}
 render();
}
function render(){
 const total=cards.length;
 const owned=cards.filter(c=>c.owned).length;
 byId('total').textContent=total;
 byId('owned').textContent=owned;
 byId('missing').textContent=total-owned;
 byId('bar').style.width=(total?owned/total*100:0)+'%';

 byId('tabs').innerHTML=categories.map(c=>`<button type="button" class="${category===c?'active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('');
 const query=byId('search').value.trim().toLocaleLowerCase();
 const status=byId('status').value;
 const visible=cards.filter(c=>
  (category==='Todos'||c.category===category)&&
  (!query||(String(c.name)+' '+String(c.category)).toLocaleLowerCase().includes(query))&&
  (status==='all'||(status==='owned'?c.owned:!c.owned))
 );
 byId('list').innerHTML=visible.length?visible.map(c=>`
  <article class="card">
   <div><strong>${escapeHtml(c.name)}</strong><div class="meta">${escapeHtml(c.category||'Personalizada')}${c.custom?' · Agregada por ti':''}</div></div>
   <div class="status"><label>${c.owned?'La tengo':'Me falta'}</label><input type="checkbox" data-own="${escapeHtml(c.id)}" ${c.owned?'checked':''} aria-label="Marcar como tengo"></div>
   <button type="button" class="danger" data-del="${escapeHtml(c.id)}" aria-label="Eliminar">✕</button>
  </article>`).join(''):'<div class="empty">No hay cartas en esta búsqueda.</div>';
}
function addCard(){
 const input=byId('newName');
 const name=input.value.trim();
 const hint=byId('addHint');
 if(!name){hint.textContent='Primero escribe el nombre de la carta.';input.focus();return;}
 const duplicate=cards.some(c=>String(c.name).trim().toLocaleLowerCase()===name.toLocaleLowerCase());
 if(duplicate){hint.textContent='Esa carta ya está en tu lista.';input.focus();return;}
 const newCard={id:'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),name,category:byId('newCat').value,owned:false,custom:true};
 cards.push(newCard);
 input.value='';
 category='Todos';
 byId('search').value='';
 byId('status').value='all';
 hint.textContent='¡Carta agregada correctamente!';
 saveCards();
 input.focus();
}

byId('add').addEventListener('click',addCard);
byId('newName').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();addCard();}});
byId('tabs').addEventListener('click',event=>{const button=event.target.closest('[data-cat]');if(button){category=button.dataset.cat;render();}});
byId('list').addEventListener('change',event=>{const id=event.target.dataset.own;if(id){const card=cards.find(c=>String(c.id)===id);if(card){card.owned=event.target.checked;saveCards();}}});
byId('list').addEventListener('click',event=>{const button=event.target.closest('[data-del]');if(button&&confirm('¿Eliminar esta carta de tu lista?')){cards=cards.filter(c=>String(c.id)!==button.dataset.del);saveCards();}});
byId('search').addEventListener('input',render);
byId('status').addEventListener('change',render);

function downloadFile(filename,content,type){
 const url=URL.createObjectURL(new Blob([content],{type}));
 const link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
byId('backup').addEventListener('click',()=>downloadFile('numbers-respaldo.json',JSON.stringify(cards,null,2),'application/json'));
byId('restore').addEventListener('click',()=>byId('file').click());
byId('file').addEventListener('change',async()=>{
 const file=byId('file').files[0];if(!file)return;
 try{const data=JSON.parse(await file.text());if(!Array.isArray(data))throw new Error('invalid');if(confirm('¿Reemplazar la lista actual con el respaldo?')){cards=data;saveCards();alert('Respaldo importado.');}}
 catch(error){alert('El archivo de respaldo no es válido.');}
 byId('file').value='';
});
byId('csv').addEventListener('click',()=>downloadFile('numbers-coleccion.csv','Nombre,Categoría,Estado\\n'+cards.map(c=>'"'+String(c.name).replace(/"/g,'""')+'","'+String(c.category||'')+'","'+(c.owned?'La tengo':'Me falta')+'"').join('\\n'),'text/csv;charset=utf-8'));
byId('reset').addEventListener('click',()=>{if(confirm('¿Desmarcar todas las cartas? No se eliminará ninguna.')){cards.forEach(c=>c.owned=false);saveCards();}});

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
 navigator.serviceWorker.register('./sw.js').catch(error=>console.warn('Service worker:',error));
}
render();
</script></body></html>
